<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6f50">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>معدة رايقة | Balanced Gut</title>
<style>
:root{--g:#1f6f50;--g2:#2f8f68;--gl:#e7f4ed;--bg:#f5f7f4;--tx:#18261f;--mu:#5f6f67;--bd:#dce5df;--w:#fff;--amb:#b7791f;--aml:#fdf3dc;--red:#b42318;--rl:#fde8e6;--ok:#1f7a4d;--blue:#1d5f8a;--bl:#e5f1f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.65;padding-bottom:78px}
header{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:6}
header h1{font-size:18px;margin:0;letter-spacing:.3px}
header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:999px;padding:6px 14px;font-size:13px}
main{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--w);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.card h2{font-size:17px;margin:0 0 8px}.card h3{font-size:15px;margin:12px 0 4px}
.card p{margin:6px 0;color:var(--mu);font-size:14.5px}
.hero{background:linear-gradient(135deg,var(--g),var(--g2));color:#fff;border:0}
.hero h2,.hero p{color:#fff}.hero p{opacity:.92}
.btn{display:block;width:100%;background:var(--g);color:#fff;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;margin-top:12px;text-align:center}
.btn.alt{background:var(--gl);color:var(--g)}.btn.wht{background:#fff;color:var(--g)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:13px;margin:0}
.btn[disabled]{opacity:.45}
.btns{display:flex;gap:10px}.btns .btn{flex:1}
label.f{display:block;font-size:14px;margin:14px 0 6px;font-weight:600}
input[type=number],input[type=date],input[type=text],select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;font-size:16px;background:#fff;color:var(--tx);font-family:inherit}
.row{display:flex;gap:10px}.row>*{flex:1}
nav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:6;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;padding:8px 2px;font-size:11px;color:var(--mu)}
nav button.on{color:var(--g);font-weight:700}nav span{display:block;font-size:20px}
.opt{display:block;border:1.5px solid var(--bd);border-radius:12px;padding:11px 12px;margin:6px 0;cursor:pointer;font-size:15px;background:#fff}
.opt.sel{border-color:var(--g);background:var(--gl);font-weight:600}
.opts2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.opts2 .opt{margin:0;text-align:center;padding:10px 6px;font-size:14px}
.chip{display:inline-block;border:1.5px solid var(--bd);border-radius:999px;padding:6px 12px;margin:3px;font-size:13.5px;background:#fff;cursor:pointer}
.chip.sel{background:var(--g);color:#fff;border-color:var(--g)}
.q{font-size:15px;margin:16px 0 4px;font-weight:600}
.prog{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:2px 0 6px}.prog i{display:block;height:100%;background:var(--g2);transition:width .3s}
.stepno{font-size:12.5px;color:var(--mu)}
.why{background:var(--bl);color:#14425f;border-radius:12px;padding:12px;font-size:13.5px;margin:10px 0}
.why b{display:block;margin-bottom:2px}
.warn{background:var(--aml);color:#6b4a0f;border-radius:12px;padding:12px;font-size:13.5px;margin:10px 0}
.danger{background:var(--rl);color:#7a1b13;border-radius:12px;padding:12px;font-size:14px;margin:10px 0}
.err{color:var(--red);font-size:13px;margin-top:8px}
.big{font-size:30px;font-weight:700;color:var(--g)}
.ring{display:flex;align-items:center;gap:16px}
.ring svg{flex:none}
.dom{margin:12px 0}.dom .top{display:flex;justify-content:space-between;font-size:14px;font-weight:600}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%}
.good{color:var(--ok)}.fair{color:var(--amb)}.low{color:var(--red)}
.bg-good{background:var(--ok)}.bg-fair{background:var(--amb)}.bg-low{background:var(--red)}
.pill{display:inline-block;font-size:11.5px;border-radius:999px;padding:1px 9px;background:var(--gl);color:var(--g);margin-inline-end:4px}
.act{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14.5px}.act:last-child{border:0}
.act b.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;font-size:12.5px;display:flex;align-items:center;justify-content:center}
.slide{text-align:center;padding:20px 8px}.slide .ic{font-size:54px}.slide h2{font-size:21px}.slide p{font-size:15.5px;text-align:start}
.dots{text-align:center;margin:10px}.dots i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bd);margin:0 3px}.dots i.on{background:var(--g)}
.cond{border-inline-start:4px solid var(--g2)}
.bri{display:flex;align-items:center;gap:10px}.bri .gl{flex:none;width:54px;text-align:center;font-size:16px;color:#8a5a2b;letter-spacing:-2px}
.langs .btn{font-size:20px;padding:18px}
small{color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}
.tag{font-size:11px;background:var(--gl);color:var(--g);border-radius:6px;padding:1px 6px;margin-inline-start:4px}
.delta{font-size:12px;margin-inline-start:6px}
details.rcp{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
details.rcp summary{cursor:pointer}details.rcp h3{margin:12px 0 4px;font-size:15px}
details.rcp ul,details.rcp ol{margin:4px 0;padding-inline-start:22px;font-size:14.5px}details.rcp li{margin:3px 0}

.stick{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--bd);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:7}
.stick .btn{margin:0;flex:1;min-height:52px;font-size:17px}.stick .btn.alt{flex:.7;border:1.5px solid var(--g)}
.navbtns{display:flex;gap:10px}.navbtns .btn{flex:1;min-height:52px;font-size:17px}.navbtns .btn.alt{flex:.7;border:1.5px solid var(--g)}
details.why{background:var(--bl);color:#14425f;border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0}
details.why summary{font-weight:600;cursor:pointer}
.seg{display:flex;background:#e6ebe6;border-radius:12px;padding:3px;margin-bottom:12px;position:sticky;top:52px;z-index:5}
.seg button{flex:1;border:0;background:none;padding:10px 2px;border-radius:10px;font-size:14px;color:var(--mu)}
.seg button.on{background:#fff;color:var(--g);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.scw{position:relative;margin:26px 0 4px}.scale{height:14px;border-radius:8px;display:flex;overflow:hidden}.scale i{display:block;height:100%}
.mk{position:absolute;top:-20px;font-size:16px;margin-inline-start:-8px;color:var(--tx)}
.scl{display:flex;font-size:11px;color:var(--mu);margin-bottom:8px}.scl span{text-align:start}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{text-align:center;font-weight:600;font-size:15px;margin-bottom:0;padding:18px 8px}.tile span{display:block;font-size:30px}
.moods{display:flex;justify-content:space-between;gap:6px}.mood{flex:1;text-align:center;font-size:30px;padding:8px 0;border:2px solid var(--bd);border-radius:14px;cursor:pointer;background:#fff}.mood.sel{border-color:var(--g);background:var(--gl)}
.opt{padding:14px 12px;font-size:16px}.chip{padding:8px 14px;font-size:14.5px}
.q{font-size:16px}

</style>
</head>

const RF=[["blood",["دم في البراز","Blood in stool"]],["black",["براز أسود قطراني","Black, tarry stool"]],["night",["ألم أو إسهال يوقظك من النوم","Pain or diarrhea that wakes you at night"]],["swallow",["صعوبة في البلع","Trouble swallowing"]],["vomit",["قيء متكرر","Repeated vomiting"]],["change",["تغيّر في عادات الإخراج لأكثر من أسبوعين","Bowel habit change lasting over 2 weeks"]]];
const COND=[
 {id:"ibs",n:["القولون العصبي (IBS)","Irritable bowel syndrome (IBS)"],
  rel:["يرتبط في الدراسات باختلاف في تنوع الميكروبيوم وفي طريقة تخمّر الأكل، ومحور الأمعاء-المخ يلعب دورًا كبيرًا، ولهذا يتداخل القولون العصبي كثيرًا مع القلق والاكتئاب.","Studies link IBS to differences in microbiome diversity and fermentation patterns, and the gut-brain axis plays a big role, which is why IBS often overlaps with anxiety and depression."],

 {id:"ibd",n:["أمراض الالتهاب المعوي (كرون / قولون تقرحي)","Inflammatory bowel disease (Crohn's / ulcerative colitis)"],

  help:["المتابعة مع طبيب الجهاز الهضمي، والتغذية تختلف في النوبات عن فترات الهدوء، فاسأل أخصائي التغذية قبل زيادة الألياف.","Follow up with your gastroenterologist; diet differs between flares and remission, so ask a dietitian before raising fiber."],caut:["لا توقف أدويتك دون الرجوع لطبيبك.","Never stop medication without your doctor."],gi:1},
 {id:"celiac",n:["الداء الزلاقي (حساسية الجلوتين)","Celiac disease"],

  help:["زيادة الألياف تدريجيًا مع الماء، حركة يومية، وروتين ثابت لدخول الحمام.","Raise fiber gradually with water, move daily and keep a regular toilet routine."]},
 {id:"obes",n:["السمنة وزيادة الوزن","Obesity / overweight"],

function compute(d){
 const h=+d.h,w=+d.w,wa=parseFloat(d.wa),preg=d.preg==="1";
 const bmi=w/((h/100)**2);
 const male=d.sex==="m";
 const waistHigh=!isNaN(wa)&&wa>=(male?94:80);
 let body=bmi<18.5?50:bmi<25?100:bmi<30?70:40;if(waistHigh)body=Math.max(0,body-15);
 const must=(bmi>20?0:bmi>=18.5?1:2)+(+d.loss||0)+(+d.acute||0);
 const dv=d.diet.map(Number);let sum=0;dv.forEach((v,i)=>sum+=DIET[i][2]?v:3-v);
 const dietPct=sum/27*100;
 const nutrition=preg?dietPct:0.6*dietPct+0.4*body;
 const bs={1:45,2:70,3:100,4:100,5:70,6:45,7:30}[d.bt];
 const fr={a:50,b:100,c:100,d:60}[d.freq];
 const sc=(d.sym||[]).filter(x=>x!=="none").length;
 const gut=0.5*bs+0.2*fr+0.3*Math.max(0,100-sc*20);
 const red=(d.rf||[]).filter(x=>x!=="none");if(+d.loss===2&&!red.includes("loss"))red.push("loss");
 const phq=d.phq.reduce((a,b)=>a+Number(b),0),i9=Number(d.phq[8])>0;
 const mood=phq<5?100:phq<10?75:phq<15?50:phq<20?30:15;
 const sl={a:40,b:70,c:100,d:70}[d.sleep],ac={0:20,1:50,2:80,3:100}[d.act],sm={0:100,1:60,2:30}[d.smoke],st=[0,100,80,60,40,20][+d.stress];
 const life=(sl+ac+sm+st)/4;
 const overall=(nutrition+gut+mood+life)/4;
 return {bmi,body,waistHigh,must,dietPct,nutrition,gut,phq,i9,mood,life,overall,red,preg,dv,sc};
}

  why:["السن والنوع يحددان الحدود المرجعية (مثل محيط الوسط) ويضمنان أن الفحص مناسب لك. هذا الفحص مصمم للبالغين.","Age and sex set the reference limits (such as waist cut-offs) and make sure the screening suits you. This screening is designed for adults."],
  r(){const d=W.d;return `<label class="f">${L("النوع","Sex")}</label>`+opts("sex",[["f",["أنثى","Female"]],["m",["ذكر","Male"]]],1)+
   `<label class="f">${L("السن (سنة)","Age (years)")}</label>`+numIn("age")+(d.age&&+d.age<18?`<div class="danger">${L("هذا التطبيق مصمم للبالغين (18 سنة فأكثر). لو عمرك أقل، يرجى استشارة طبيب أو أخصائي.","This app is designed for adults (18+). If you are younger, please consult a doctor or specialist.")}</div>`:"")+
   `<label class="f">${L("هل أنت حامل أو مرضعة؟","Are you pregnant or breastfeeding?")}</label>`+opts("preg",[["0",["لا","No"]],["1",["نعم","Yes"]]],1)},
  v(){const d=W.d;return d.sex&&+d.age>=18&&+d.age<=110&&d.preg!=null}},
 {ic:"📏",t:["جسمك","Your body"],
  why:["مؤشر كتلة الجسم ومحيط الوسط يكشفان الخطر الأيضي مبكرًا، وفقدان الوزن غير المقصود قد يكون علامة تحتاج متابعة. السمنة والنحافة الزائدة كلاهما مرتبط باختلال الميكروبيوم.","BMI and waist reveal metabolic risk early, and unintentional weight loss can be a sign that needs follow-up. Both obesity and low body weight are linked to microbiome imbalance."],
  r(){return `<div class="row"><div><label class="f">${L("الطول (سم)","Height (cm)")}</label>${numIn("h")}</div><div><label class="f">${L("الوزن (كجم)","Weight (kg)")}</label>${numIn("w")}</div></div>
   <label class="f">${L("محيط الوسط (سم) - اختياري","Waist (cm) - optional")}</label>${numIn("wa")}
   <div class="q">${L("فقدان وزن غير مقصود خلال 3–6 شهور","Unintentional weight loss in the past 3–6 months")}</div>`+
   opts("loss",[["0",["أقل من 5%","Less than 5%"]],["1",["من 5% إلى 10%","5% to 10%"]],["2",["أكثر من 10%","More than 10%"]]])+
   `<div class="q">${L("هل أنت مريض جدًا حاليًا ولم تأكل تقريبًا منذ 5 أيام أو أكثر؟","Are you very sick right now AND have you barely eaten for 5 days or more?")}</div>
<div class="why" style="margin:8px 0 10px"><b>${L("اختر «نعم» فقط لو الاثنين معًا:","Choose Yes only if BOTH are true:")}</b>
① ${L("عندك مرض شديد ومفاجئ الآن (مثل عدوى شديدة، أو قيء وإسهال شديدين، أو بعد جراحة)","You have a sudden, serious illness now (for example a severe infection, severe vomiting or diarrhea, or after surgery)")}<br>
② ${L("ولم تأكل تقريبًا منذ 5 أيام أو أكثر","and you have barely eaten for 5 days or more")}<br>
<b style="margin-top:6px">${L("اختر «لا» في باقي الحالات:","Choose No in all other cases:")}</b>
${L("صحتك عادية، أو عندك مرض مزمن (مثل السكر) لكنك تأكل بشكل طبيعي. أغلب الناس يختارون «لا».","you feel well, or you have a long-term condition (like diabetes) but you eat normally. Most people choose No.")}</div>`+opts("acute",[["0",["لا","No"]],["2",["نعم","Yes"]]],1)},
  v(){const d=W.d;return +d.h>=100&&+d.h<=230&&+d.w>=25&&+d.w<=300&&d.loss!=null&&d.acute!=null}},
 {ic:"🥗",t:["أكلك","Your eating"],
  why:["الألياف والنباتات المتنوعة والأطعمة المخمّرة هي الغذاء الأساسي للميكروبيوم، أما الإفراط في المقليات والسكريات فيقلل التنوع. جودة الغذاء من أقوى العوامل التي نستطيع تغييرها.","Fiber, plant variety and fermented foods feed your microbiome, while a lot of fried food and sugar lowers diversity. Diet quality is one of the strongest factors we can change."],
  r(){const a=W.d.diet||[];return `<p style="color:var(--mu);font-size:14px">${L("كم يوم في الأسبوع تأكل هذه الأطعمة؟ (ما عدا الماء: كوب في اليوم)","How many days a week do you eat these foods? (Water is the exception: cups per day)")}</p>`+DIET.map((it,i)=>`<div class="q">${pk(it[1])}</div><div class="opts2">${(it[0]==="water"?WATER:FREQ).map(([v,l])=>`<label class="opt ${a[i]===v?"sel":""}" onclick="setA('diet',${i},${v},9)">${pk(l)}</label>`).join("")}</div>`).join("")},
  v(){return arrOk(W.d.diet,9)}},
 {ic:"💩",t:["هضمك","Your digestion"],
  why:["شكل البراز وانتظامه من أبسط المؤشرات على حركة الأمعاء وصحة الميكروبيوم. الإمساك والإسهال المزمنان وأعراض مثل الانتفاخ تتداخل كثيرًا مع التوتر والمزاج.","Stool form and regularity are simple markers of gut motility and microbiome health. Chronic constipation or diarrhea and symptoms such as bloating overlap strongly with stress and mood."],
  r(){return `<div class="q">${L("اختر الشكل الأكثر تكرارًا (مقياس بريستول)","Pick your most common form (Bristol scale)")}</div>`+BR.map(([g,l],i)=>`<label class="opt bri ${W.d.bt==i+1?"sel":""}" onclick="pick('bt',${i+1})"><span class="gl">${g}</span><span><b>${i+1}</b> · ${pk(l)} <span class="tag">${i<2?L("إمساك","Constipation"):i<4?L("طبيعي","Normal"):i==4?L("ميل للّيونة","Tending soft"):L("إسهال","Diarrhea")}</span></span></label>`).join("")+
   `<div class="q">${L("عدد مرات الإخراج","Bowel movement frequency")}</div>`+opts("freq",[["a",["أقل من 3 مرات أسبوعيًا","Fewer than 3 per week"]],["b",["3–6 مرات أسبوعيًا","3–6 per week"]],["c",["1–3 مرات يوميًا","1–3 per day"]],["d",["أكثر من 3 مرات يوميًا","More than 3 per day"]]],1)+
   `<div class="q">${L("أعراض تعانيها حاليًا","Current symptoms")}</div>`+chips("sym",SYM.concat([["none",["لا شيء","None"]]]),1)+
   `<div class="q">${L("علامات تحذيرية (اختر ما ينطبق)","Warning signs (select any that apply)")}</div>`+chips("rf",RF.concat([["none",["لا شيء","None"]]]),1)},
  v(){const d=W.d;return d.bt&&d.freq&&(d.sym||[]).length>0&&(d.rf||[]).length>0}},
 {ic:"🧠",t:["مزاجك (PHQ-9)","Your mood (PHQ-9)"],
  why:["PHQ-9 أداة فحص عالمية لأعراض الاكتئاب. اكتشاف الأعراض مبكرًا يتيح التدخل قبل أن تتفاقم، والأمعاء والمزاج يؤثران في بعضهما، فمتابعة الاثنين معًا أدق.","PHQ-9 is a widely used screening tool for depressive symptoms. Spotting symptoms early allows action before they worsen, and gut and mood influence each other, so tracking both is more informative."],
  r(){const a=W.d.phq||[];return `<p style="color:var(--mu);font-size:14px">${L("على مدار الأسبوعين الماضيين، كم مرة أزعجتك أي من المشاكل التالية؟","Over the last 2 weeks, how often have you been bothered by any of the following problems?")}</p>`+PHQ.map((x,i)=>`<div class="q">${i+1}. ${pk(x)}</div><div class="opts2">${PHQO.map(([v,l])=>`<label class="opt ${a[i]===v?"sel":""}" onclick="setA('phq',${i},${v},9)">${pk(l)}</label>`).join("")}</div>`).join("")+
   (Number(a[8])>0?`<div class="danger">${crisis()}</div>`:"")+
   (a.some(x=>x>0)?`<div class="q">10. ${L("إذا قمت بفحص أي مشاكل، فما مدى صعوبة هذه المشاكل في القيام بعملك أو الاهتمام بالأشياء في المنزل أو التعايش مع أشخاص آخرين؟","If you checked off any problems, how difficult have these problems made it for you to do your work, take care of things at home, or get along with other people?")}</div><div class="opts2">${PHQ10.map(([v,l])=>`<label class="opt ${W.d.phq10===v?"sel":""}" onclick="pick('phq10',${v})">${pk(l)}</label>`).join("")}</div>`:"")+
   `<p style="font-size:12px;color:var(--mu);margin-top:14px">${L("استبيان صحة المريض PHQ-9. تم تطويره بواسطة الدكتورين روبرت إل سبيتزر وجانيت بي دبليو ويليامز وكورت كرونكي وزملائه، بمنحة تعليمية من شركة Pfizer Inc. لا يلزم الحصول على إذن لإعادة الإنتاج أو الترجمة أو العرض أو التوزيع.","Patient Health Questionnaire (PHQ-9). Developed by Drs. Robert L. Spitzer, Janet B.W. Williams, Kurt Kroenke and colleagues, with an educational grant from Pfizer Inc. No permission required to reproduce, translate, display or distribute.")}</p>`},
  v(){return arrOk(W.d.phq,9)&&(!W.d.phq.some(x=>x>0)||W.d.phq10!=null)}},
 {ic:"🌙",t:["نمط حياتك","Your lifestyle"],
  why:["النوم والحركة والتوتر والتدخين تؤثر على الميكروبيوم والمزاج وحركة الأمعاء، وهي من أسهل العادات التي يمكن تعديلها.","Sleep, movement, stress and smoking affect the microbiome, mood and gut motility, and they are among the easiest habits to change."],
  r(){return `<div class="q">${L("ساعات النوم الليلية المعتادة","Usual nightly sleep")}</div>`+opts("sleep",[["a",["أقل من 6","Under 6 h"]],["b",["6–7","6–7 h"]],["c",["7–9","7–9 h"]],["d",["أكثر من 9","Over 9 h"]]],1)+
   `<div class="q">${L("أيام النشاط البدني (30 دقيقة فأكثر) أسبوعيًا","Days per week with 30+ min of physical activity")}</div>`+opts("act",[["0",["لا شيء","None"]],["1",["1–2","1–2"]],["2",["3–4","3–4"]],["3",["5 أو أكثر","5 or more"]]],1)+
   `<div class="q">${L("التدخين","Smoking")}</div>`+opts("smoke",[["0",["لا أدخن","Non-smoker"]],["1",["أحيانًا","Occasionally"]],["2",["يوميًا","Daily"]]],1)+
   `<div class="q">${L("مستوى التوتر في آخر شهر","Stress level in the last month")}</div>`+opts("stress",[["1",["1 منخفض","1 Low"]],["2",["2","2"]],["3",["3","3"]],["4",["4","4"]],["5",["5 مرتفع","5 High"]]],0).replace('class=""','class="opts2"')},
  v(){const d=W.d;return d.sleep&&d.act!=null&&d.smoke!=null&&d.stress}},
 {ic:"🩺",t:["حالتك الصحية","Your health conditions"],
  why:["بعض الأمراض لها علاقة مباشرة بالميكروبيوم، وبعضها يغيّر نوع الأكل المناسب لك (مثل مرض الكلى والسكري). معرفة حالتك تجعل الخطة آمنة وأدق، وسنشرح لك العلاقة بين كل مرض وميكروبيوم الأمعاء.","Some conditions are directly tied to the microbiome, and some change which food is right for you (such as kidney disease or diabetes). Knowing your health history makes the plan safer and more accurate, and we will explain how each condition relates to your gut microbiome."],
  r(){return `<div class="q">${L("هل تعاني من أي من الأمراض التالية؟","Do you have any of the following conditions?")}</div>`+chips("cond",COND.map(c=>[c.id,c.n]).concat([["none",["لا شيء مما سبق","None of these"]]]),1)},
  v(){return (W.d.cond||[]).length>0}}
];
function crisis(){return L("لو عندك أفكار لإيذاء نفسك، إنت مش لوحدك. تواصل مع شخص تثق به أو اتصل دلوقتي بخط الدعم النفسي المجاني في مصر: 08008880700، أو الإسعاف 123. لو في خطر فوري توجّه لأقرب طوارئ.","If you have thoughts of hurting yourself, you are not alone. Talk to someone you trust or call Egypt's free mental health hotline now: 08008880700, or ambulance 123. If in immediate danger, go to the nearest emergency room.")}

function ass(){
 const s=STEPS[W.step],n=STEPS.length;
 return `<div class="stepno">${L("الخطوة","Step")} ${W.step+1} / ${n}</div><div class="prog"><i style="width:${(W.step+1)/n*100}%"></i></div>
 <div class="card"><h2>${s.ic} ${pk(s.t)}</h2>
 <details class="why"><summary>ℹ️ ${L("ليه ده مهم؟ (اضغط)","Why does this matter? (tap)")}</summary><p style="color:inherit;margin:8px 0 0">${pk(s.why)}</p></details>
 ${s.r()}
 ${W.err&&!s.v()?`<div class="err">${L("من فضلك أكمل كل الإجابات المطلوبة.","Please complete all required answers.")}</div>`:""}</div>
 <div class="stick"><button class="btn alt" onclick="back()">${ARB()} ${L("السابق","Back")}</button><button class="btn" onclick="next()">${W.step===n-1?L("عرض النتيجة","See my result")+" ✓":L("التالي","Next")+" "+ARN()}</button></div>`}
function next(){const s=STEPS[W.step];if(!s.v()){W.err=true;keep();return}
 W.err=false;if(W.step===STEPS.length-1){finish();return}W.step++;persist();render();scrollTo(0,0)}
function back(){W.err=false;if(W.step===0){view="home"}else{W.step--;persist()}render();scrollTo(0,0)}
function finish(){const r=compute(W.d);S.ass.push({d:today(),data:JSON.parse(JSON.stringify(W.d)),r});S.draft=null;save();view="res";render();scrollTo(0,0)}
function startAss(resume){if(!(resume&&S.draft)){W={step:0,d:{},err:false}}else{W={step:S.draft.step,d:S.draft.d,err:false}}view="ass";render();scrollTo(0,0)}

/* ============ results ============ */
function ring(p){const c=2*Math.PI*44,o=c*(1-p/100),col=p>=80?"var(--ok)":p>=60?"var(--amb)":"var(--red)";
 return `<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="44" fill="none" stroke="var(--bd)" stroke-width="10"/><circle cx="55" cy="55" r="44" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}" transform="rotate(-90 55 55)"/><text x="55" y="62" text-anchor="middle" font-size="26" font-weight="700" fill="${col}">${Math.round(p)}</text></svg>`}
function domRow(name,score,prev,note){
 const dl=prev==null?"":(()=>{const x=Math.round(score-prev);return `<span class="delta ${x>0?"good":x<0?"low":""}">${x>0?"▲ +"+x:x<0?"▼ "+x:"="}</span>`})();
 return `<div class="dom"><div class="top"><span>${name}</span><span class="${level(score)}">${Math.round(score)}% · ${levelTxt(score)}${dl}</span></div><div class="bar"><i class="bg-${level(score)}" style="width:${score}%"></i></div><small>${note}</small></div>`}
function bmiCard(d,r){
 if(r.preg)return `<div class="card"><h2>⚖️ ${L("الوزن","Weight")}</h2><p>${L("مؤشر كتلة الجسم لا ينطبق أثناء الحمل أو الرضاعة. تابع وزنك مع طبيبك.","BMI does not apply during pregnancy or breastfeeding. Follow your weight with your doctor.")}</p></div>`;
 const h=+d.h/100,w=+d.w,b=r.bmi,lo=18.5*h*h,hi=24.9*h*h;
 const cls=b<18.5?"fair":b<25?"good":b<30?"fair":"low";
 const pos=Math.max(1,Math.min(99,(b-15)/25*100));
 let adv;
 if(b<18.5)adv=L(`للوصول إلى المدى الصحي تحتاج زيادة حوالي ${fx(lo-w)} كجم بتغذية مفيدة وليس بالسكريات.`,`To reach the healthy range you need to gain about ${fx(lo-w)} kg through nutritious food, not sugar.`);
 else if(b<25)adv=L("وزنك ضمن المدى الصحي لطولك. حافظ عليه بالأكل المتنوع والحركة.","Your weight is within the healthy range for your height. Keep it with varied food and movement.");
 else adv=L(`المدى الصحي لطولك أقل من ${fx(hi)} كجم. هدف واقعي أولًا: إنقاص 5% (${fx(w*.05)} كجم) إلى 10% (${fx(w*.1)} كجم) خلال 3–6 شهور، وهذا وحده يحسّن السكر والضغط والهضم.`,`The healthy range for your height is below ${fx(hi)} kg. A realistic first goal: lose 5% (${fx(w*.05)} kg) to 10% (${fx(w*.1)} kg) over 3–6 months, which alone improves blood sugar, blood pressure and digestion.`);
 return `<div class="card"><h2>⚖️ ${L("حالتك حسب مؤشر كتلة الجسم","Your BMI category")}</h2>
 <div class="big ${cls}" style="color:inherit">${bmiCat(b)}</div><p style="margin:0">BMI = <b>${fx(b)}</b> · ${L("وزنك","weight")} ${fx(w)} ${L("كجم","kg")} · ${L("طولك","height")} ${fx(+d.h)} ${L("سم","cm")}</p>
 <div class="scw"><div class="scale"><i style="width:14%;background:var(--amb)"></i><i style="width:26%;background:var(--ok)"></i><i style="width:20%;background:var(--amb)"></i><i style="width:40%;background:var(--red)"></i></div><span class="mk" style="inset-inline-start:${pos}%">▼</span></div>
 <div class="scl"><span style="width:14%">&lt;18.5</span><span style="width:26%">18.5–24.9</span><span style="width:20%">25–29.9</span><span style="width:40%">30+</span></div>
 <p>${L("المدى الصحي لوزنك:","Healthy weight range:")} <b>${fx(lo)}–${fx(hi)} ${L("كجم","kg")}</b></p><p>${adv}</p>
 ${r.waistHigh?`<p>⚠️ ${L("محيط وسطك مرتفع، وهذا يزيد الخطر الأيضي حتى مع وزن قريب من الطبيعي.","Your waist is high, which raises metabolic risk even when weight is near normal.")}</p>`:""}
 <p><small>${L("BMI مقياس عام ولا يفرّق بين العضل والدهون.","BMI is a general measure and does not separate muscle from fat.")}</small></p></div>`}

function resTabs(){return `<div class="seg">${[["sum",L("ملخص","Summary")],["plan",L("خطتي","My plan")],["meals",L("وجباتي","Meals")],["cond",L("حالتي","Conditions")]].map(([k,l])=>`<button class="${resTab===k?"on":""}" onclick="resTab='${k}';keep()">${l}</button>`).join("")}</div>`}
function alerts(r){return ((r.i9||r.phq>=20)?`<div class="danger"><b>${L("نهتم بك","We care about you")}</b><br>${crisis()}</div>`:"")+
 (r.red.length?`<div class="danger"><b>${L("علامات تحذيرية","Warning signs")}</b><br>${L("اخترت علامات تستدعي مراجعة الطبيب قريبًا:","You selected signs that call for seeing a doctor soon:")} ${r.red.map(x=>x==="loss"?L("فقدان وزن غير مقصود","unintentional weight loss"):pk((RF.find(y=>y[0]===x)||[0,["",""]])[1])).join("، ")}</div>`:"")}
function actList(items,start){return items.map((a,i)=>`<div class="act"><b class="n">${i+1}</b><div>${i<3&&start?`<span class="pill">${L("ابدأ الآن","Start now")}</span>`:""}${pk(a.t)}</div></div>`).join("")}

function res(){
 if(!S.ass.length)return `<div class="card"><h2>${L("لا توجد نتيجة بعد","No result yet")}</h2><p>${L("ابدأ التقييم لتحصل على نتيجتك وخطة التحسين.","Start the assessment to get your result and improvement plan.")}</p><button class="btn" onclick="startAss()">${L("ابدأ التقييم","Start assessment")}</button></div>`;
 const A=S.ass[S.ass.length-1],r=A.r,d=A.data,P=S.ass.length>1?S.ass[S.ass.length-2].r:null,plan=buildPlan(d,r);
 let body="";
 if(resTab==="sum"){
  const notes={n:r.preg?L("تم احتساب الغذاء فقط أثناء الحمل/الرضاعة.","Only diet was counted during pregnancy/breastfeeding."):`BMI ${fx(r.bmi)} · MUST ${r.must}${r.waistHigh?" · "+L("محيط وسط مرتفع","high waist"):""}`,
   g:`${L("بريستول","Bristol")} ${d.bt} · ${r.sc} ${L("أعراض","symptoms")}`,m:`PHQ-9: ${r.phq}/27 · ${phqLabel(r.phq)}`+(d.phq10!=null?` · ${L("صعوبة الأداء اليومي","daily-function difficulty")}: ${pk(PHQ10[d.phq10][1])}`:""),l:`${L("نوم","sleep")} · ${L("نشاط","activity")} · ${L("توتر","stress")}`};
  body=`<div class="card hero"><div class="ring">${ring(r.overall)}<div><h2 style="margin:0">${L("مؤشر العافية","Wellness index")}</h2><p style="margin:4px 0">${levelTxt(r.overall)} · ${A.d}</p>${P?`<p>${L("عن التقييم السابق:","vs last check:")} ${Math.round(r.overall-P.overall)>0?"+":""}${Math.round(r.overall-P.overall)}</p>`:""}</div></div></div>
  ${alerts(r)}${bmiCard(d,r)}${kcalCard(d,r)}

  st:[["اغلِ اللبن وبرّده إلى حوالي 40°م.","Boil the milk and cool it to about 40°C."],["أضف الكبادئ وقلّب جيدًا.","Add the starter and stir well."],["غطِّ الإناء واتركه في درجة حرارة الغرفة 10–16 ساعة (أقل في الصيف الحار) حتى يتماسك قليلًا ويصبح طعمه حامضًا خفيفًا.","Cover and leave at room temperature for 10–16 hours (less in hot summer) until slightly set and mildly tangy."],["قلّبه جيدًا وبرّده في الثلاجة، وخفّفه بقليل ماء بارد إن أردت قوامًا أخف.","Stir well and chill; thin with a little cold water if you like it lighter."]],
  note:["استخدم لبنًا مغليًا أو مبسترًا فقط، ولا تستخدم لبنًا خامًا خصوصًا للحامل والأطفال.","Use boiled or pasteurised milk only, never raw milk, especially for pregnant women and children."],f:["dairy"]},
 {id:"kefir",n:["كفير اللبن","Milk kefir"],t:["5 دقائق + 18–24 ساعة","5 min + 18–24 h"],y:["حوالي 2 كوب","About 2 cups"],
  ing:[["1 ملعقة كبيرة حبيبات كفير (من مصدر موثوق)","1 tablespoon kefir grains (from a trusted source)"],["2 كوب لبن مغلي ومبرّد أو مبستر","2 cups boiled-and-cooled or pasteurised milk"]],
  st:[["ضع الحبيبات واللبن في برطمان زجاج نظيف واملأه حتى ثلثيه.","Put the grains and milk in a clean glass jar, filled to two-thirds."],["غطِّه بقماش مربوط واتركه بعيدًا عن الشمس 18–24 ساعة.","Cover with a cloth tied on and keep it out of sunlight for 18–24 hours."],["صفِّه بمصفاة بلاستيك، واحتفظ بالحبيبات وضعها في لبن جديد.","Strain through a plastic sieve, keep the grains and put them in fresh milk."],["اشرب الكفير بارد. ابدأ بنصف كوب أول مرة.","Drink the kefir cold. Start with half a cup the first time."]],
  note:["مناسب كإضافة للفطار، لكنه قوي، فابدأ تدريجيًا خصوصًا مع القولون العصبي.","A strong fermented food, so start gradually, especially with IBS."],f:["dairy"]},
 {id:"pickle",n:["مخلل خيار أو جزر أو لفت بالشمندر (متخمّر بالملح)","Fermented cucumber, carrot or turnip-beet pickles (salt brine)"],t:["20 دقيقة + 3–7 أيام","20 min + 3–7 days"],y:["برطمان 1 لتر","One 1-litre jar"],
  ing:[["500 جم خيار صغير أو جزر أو لفت مقطّع","500 g small cucumbers, carrots or turnip pieces"],["1 شمندر صغير مقطّع (مع اللفت للون)","1 small beetroot, sliced (with turnip, for colour)"],["2–3 فصوص ثوم","2–3 garlic cloves"],["1 لتر ماء مغلي ومبرّد","1 litre boiled and cooled water"],["30 جم ملح خشن غير معالج باليود (حوالي ملعقتين كبيرتين، والأفضل بالميزان)","30 g coarse non-iodised salt (about 2 tablespoons; weigh it if you can)"]],
  st:[["ذوّب الملح في الماء لتحصل على محلول ملحي 3%.","Dissolve the salt in the water to make a 3% brine."],["ضع الخضار والثوم في برطمان زجاج نظيف.","Pack the vegetables and garlic into a clean glass jar."],["اسكب المحلول حتى يغطي الخضار تمامًا، وثبّتها تحت السائل بكيس صغير مملوء بمحلول ملحي أو غطاء زجاجي.","Pour in the brine to cover the vegetables completely, and keep them under the liquid with a small brine-filled bag or a glass weight."],["غطِّ بغطاء مرخي واتركه 3–7 أيام بعيدًا عن الشمس (2–4 أيام في الصيف الحار). تذوّق من اليوم الثالث.","Cover loosely and leave out of sunlight for 3–7 days (2–4 in hot summer). Taste from day 3."],["عندما يصبح طعمه حامضًا وفيه فقاعات، أحكم الغطاء وضعه في الثلاجة. يحفظ 1–2 شهر.","When it tastes tangy and bubbly, close the lid and refrigerate. Keeps 1–2 months."]],
  note:["المخلل المشتري المحفوظ بالخل ليس بروبيوتيك. إن ظهر عفن مُزغّب ملوّن فتخلص من البرطمان كله. الطبقة البيضاء المسطحة تُزال وغالبًا غير ضارة.","Shop pickles kept in vinegar are not probiotic. Discard the whole jar if fuzzy coloured mould appears. A flat white film can be skimmed off and is usually harmless."],f:["salt"]},
 {id:"kraut",n:["كرنب وجزر مخمّر بالكمون","Fermented cabbage and carrot with cumin"],t:["20 دقيقة + 5–10 أيام","20 min + 5–10 days"],y:["برطمان 1 لتر","One 1-litre jar"],
  ing:[["1 كجم كرنب مقطّع رفيعًا","1 kg cabbage, thinly shredded"],["1 جزرة مبشورة","1 carrot, grated"],["20 جم ملح خشن (2% من وزن الخضار)","20 g coarse salt (2% of the vegetable weight)"],["1 ملعقة صغيرة كمون حب وفص ثوم (اختياري)","1 teaspoon cumin seeds and a garlic clove (optional)"]],
  st:[["اعجن الكرنب والجزر مع الملح 5–10 دقائق حتى يخرج سائل.","Massage the cabbage and carrot with the salt for 5–10 minutes until liquid is released."],["اكبسه بقوة في برطمان نظيف حتى يعلوه السائل، ثم ضع ثقلًا فوقه.","Pack it tightly into a clean jar until the liquid rises above it, then weigh it down."],["غطِّ بغطاء مرخي واتركه 5–10 أيام في الظل، وافتح الغطاء يوميًا ليخرج الغاز.","Cover loosely and leave in the shade for 5–10 days, opening the lid daily to release gas."],["عندما يعجبك طعمه الحامض ضعه في الثلاجة. يحفظ أشهرًا.","When you like the sourness, refrigerate. Keeps for months."]],
  note:["اتركه كطبق جانبي صغير (2–3 ملاعق) في البداية.","Start with a small side serving (2–3 spoonfuls)."],f:["salt"]},
 {id:"salad",n:["سلطة زبادي بالخيار والنعناع والثوم","Yogurt salad with cucumber, mint and garlic"],t:["10 دقائق","10 min"],y:["2 أكواب","2 servings"],
  ing:[["1 كوب (200 جم) زبادي حي","1 cup (200 g) live yogurt"],["1 خيارة مفرومة","1 cucumber, chopped"],["1 فص ثوم مهروس (بريبايوتك)","1 garlic clove, crushed (prebiotic)"],["1 ملعقة كبيرة نعناع مفروم أو مجفف","1 tablespoon chopped or dried mint"],["رشة ملح وكمون و1 ملعقة صغيرة زيت زيتون","A pinch of salt and cumin, and 1 teaspoon olive oil"]],
  st:[["اخلط كل المكونات في طبق.","Mix everything in a bowl."],["اتركها 10 دقائق لتتشرب النكهة، وقدّمها بارد بجانب الغدا.","Rest for 10 minutes so the flavours blend, then serve cold with lunch."]],
  note:["لا تسخّنها حتى لا تموت البكتيريا الحية.","Do not heat it, so the live cultures survive."],f:["dairy"]},
 {id:"oats",n:["شوفان بالرايب والتمر (ليلي)","Overnight oats with rayeb and dates"],t:["5 دقائق + ليلة في الثلاجة","5 min + overnight in the fridge"],y:["حصة 1","1 serving"],
  ing:[["4 ملاعق كبيرة شوفان (40 جم)","4 tablespoons oats (40 g)"],["3/4 كوب لبن رايب (150 جم)","3/4 cup rayeb (150 g)"],["2 حبة تمر مقطّعة","2 dates, chopped"],["1 ملعقة كبيرة لوز مفروم ونصف ملعقة صغيرة قرفة","1 tablespoon chopped almonds and half a teaspoon cinnamon"]],
  st:[["اخلط الشوفان والرايب والتمر والقرفة في برطمان.","Mix the oats, rayeb, dates and cinnamon in a jar."],["ضعه في الثلاجة 6–8 ساعات.","Refrigerate for 6–8 hours."],["أضف اللوز وقطعة فاكهة قبل الأكل.","Top with almonds and a piece of fruit before eating."]],
  note:["مرتبط بالبريبايوتك (الشوفان) والبروبيوتيك (الرايب). لمرضى السيلياك استخدم شوفانًا مؤكدًا أنه خالٍ من الجلوتين.","Pairs prebiotic (oats) with probiotic (rayeb). For celiac disease, use certified gluten-free oats."],f:["dairy","gluten"]},
 {id:"smoothie",n:["سموثي رايب بالموز والشوفان","Rayeb, banana and oat smoothie"],t:["5 دقائق","5 min"],y:["حصة 1","1 serving"],
  ing:[["1 كوب لبن رايب بارد","1 cup chilled rayeb"],["1 موزة (الأفضل شبه ناضجة)","1 banana (slightly under-ripe is best)"],["2 ملعقة كبيرة شوفان","2 tablespoons oats"],["1 ملعقة صغيرة طحينة وقطع ثلج","1 teaspoon tahini and ice cubes"]],
  st:[["ضع كل المكونات في الخلاط.","Put everything in the blender."],["اخلط دقيقة واحدة وقدّمه فورًا.","Blend for 1 minute and serve right away."]],
  note:["الموز شبه الناضج غني بالنشا المقاوم الذي تتغذى عليه بكتيريا الأمعاء.","Slightly under-ripe banana is rich in resistant starch that gut bacteria feed on."],f:["dairy","gluten"]},
 {id:"dip",n:["صلصة زبادي بالطحينة والبقدونس","Yogurt-tahini and parsley sauce"],t:["5 دقائق","5 min"],y:["4 حصص صغيرة","4 small servings"],
  ing:[["1/2 كوب زبادي حي","1/2 cup live yogurt"],["2 ملعقة كبيرة طحينة","2 tablespoons tahini"],["1 فص ثوم مهروس وعصير نصف ليمونة","1 crushed garlic clove and juice of half a lemon"],["بقدونس مفروم ورشة ملح","Chopped parsley and a pinch of salt"]],
  st:[["اخلط كل المكونات حتى تتجانس.","Stir everything until smooth."],["قدّمها مع خضار نيئة أو مشوية، أو مع الفلافل والسمك.","Serve with raw or grilled vegetables, falafel or fish."]],
  note:["تمنح الخضار طعمًا ألذ فتزيد الكمية التي تأكلها منها.","It makes vegetables tastier, so you tend to eat more of them."],f:["dairy"]}
];
function recipes(){
 const A=S.ass[S.ass.length-1],c=A?(A.data.cond||[]):[],has=id=>c.includes(id);
 const ctx=[];
 if(has("htn")||has("ckd"))ctx.push(L("المخلل مرتفع الصوديوم: لا تزد عن 2–3 ملاعق، ومع الضغط أو الكلى استشر طبيبك أولًا.","Pickles are high in sodium: keep to 2–3 spoonfuls, and with blood pressure or kidney problems ask your doctor first."));
 if(has("celiac"))ctx.push(L("للسيلياك: استخدم شوفانًا مؤكدًا خلوّه من الجلوتين.","For celiac disease: use certified gluten-free oats."));
 if(has("ibs")||has("ibd"))ctx.push(L("مع القولون العصبي أو الالتهاب المعوي: ابدأ بكميات صغيرة (2–3 ملاعق) وتوقف لو ساءت الأعراض، واسأل طبيبك.","With IBS or IBD: start small (2–3 spoonfuls), stop if symptoms worsen, and ask your doctor."));
 if(has("t2d"))ctx.push(L("مع السكري: اختر زبادي غير محلّى وقلّل التمر.","With diabetes: choose unsweetened yogurt and go light on dates."));
 return `<div class="card"><h2>🥛 ${L("وصفات مصرية بروبيوتيك","Egyptian probiotic recipes")}</h2>
 <p>${L("البروبيوتيك كائنات حية مفيدة تصل للأمعاء بكمية كافية. أفضل مصادرها الغذائية: الزبادي والرايب والكفير والمخلل المتخمّر طبيعيًا. في تجربة نُشرت عام 2021، زاد الأكل المخمّر لمدة 10 أسابيع تنوع الميكروبيوم وخفّض علامات الالتهاب، لكن الاستجابة تختلف من شخص لآخر.","Probiotics are beneficial live microbes that reach the gut in sufficient numbers. The best food sources are yogurt, rayeb, kefir and naturally fermented pickles. In a 2021 trial, 10 weeks of fermented foods increased microbiome diversity and lowered inflammation markers, but responses vary between people.")}</p>
 <p>${L("اجمعها مع البريبايوتك (ثوم، بصل، كراث، موز، شوفان، بقوليات) لتغذية البكتيريا.","Pair them with prebiotics (garlic, onion, leek, banana, oats, legumes) to feed the bacteria.")}</p></div>
 <div class="warn"><b>${L("سلامة الغذاء","Food safety")}</b><br>${L("استخدم أوعية زجاج نظيفة ولبنًا مغليًا أو مبسترًا. الحوامل ومن لديهم مناعة ضعيفة أو قسطرة وريدية يستشيرون الطبيب قبل الكفير والمخللات البيتية. تخلّص من أي طعام رائحته أو شكله مريب.","Use clean glass jars and boiled or pasteurised milk. Pregnant women and people with weak immunity or a central line should ask a doctor before kefir and home ferments. Discard anything that smells or looks off.")}${ctx.length?"<br>• "+ctx.join("<br>• "):""}</div>
 ${RCP.map(rc=>`<details class="rcp"><summary><b>${pk(rc.n)}</b><br><small>⏱ ${pk(rc.t)} · ${pk(rc.y)}${rc.f.includes("dairy")?" · 🥛":""}${rc.f.includes("salt")?" · 🧂":""}</small></summary>
 <h3>${L("المكونات","Ingredients")}</h3><ul>${rc.ing.map(i=>`<li>${pk(i)}</li>`).join("")}</ul>
 <h3>${L("الطريقة","Method")}</h3><ol>${rc.st.map(i=>`<li>${pk(i)}</li>`).join("")}</ol>
 <div class="why" style="margin-bottom:0">💡 ${pk(rc.note)}</div></details>`).join("")}`}
function more(){return `<div class="grid2"><div class="card tile" onclick="go('recipes')"><span>🥛</span>${L("وصفات بروبيوتيك","Probiotic recipes")}</div><div class="card tile" onclick="go('foods')"><span>🥗</span>${L("قاعدة الأكل","Food database")}</div><div class="card tile" onclick="go('learn')"><span>📚</span>${L("تعلّم","Learn")}</div><div class="card tile" onclick="wipe()"><span>🗑️</span>${L("مسح بياناتي","Delete my data")}</div></div>
 <div class="warn" style="margin-top:12px">${L("معدة رايقة: تطبيق تثقيفي للفحص المبدئي وليس تشخيصًا طبيًا. بياناتك تبقى على جهازك.","Balanced Gut is an educational app for preliminary screening, not a medical diagnosis. Your data stays on your device.")}</div>`}

/* ============ shell ============ */
function setLang(l){S.lang=l;save();render()}
function toggleLang(){setLang(S.lang==="ar"?"en":"ar")}
function go(v){view=v;tmp={};sel=new Set();q="";render();scrollTo(0,0)}
function wipe(){if(confirm(L("متأكد؟ سيتم مسح كل شيء من الجهاز.","Sure? Everything will be erased from this device."))){const l=S.lang;S={lang:l,seen:true,ass:[],diary:[],draft:null,plan:null};save();go("home")}}
function render(){
 const app=document.getElementById("app"),nav=document.getElementById("nav"),lb=document.getElementById("langbtn");
 if(!S.lang){document.documentElement.dir="ltr";lb.style.display="none";nav.style.display="none";
  app.innerHTML=`<div class="card" style="margin-top:30px;text-align:center"><h2 style="font-size:24px">معدة رايقة · Balanced Gut</h2><p>اختر اللغة / Choose language</p><div class="langs"><button class="btn" onclick="setLang('ar')">العربية</button><button class="btn" onclick="setLang('en')">English</button></div></div>`;return}
 document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";document.documentElement.lang=S.lang;
 document.getElementById("ttl").textContent=L("معدة رايقة 🌿","Balanced Gut 🌿");lb.style.display="";lb.textContent=S.lang==="ar"?"English":"العربية";
 if(!S.seen){nav.style.display="none";const x=INTRO[intro];
  app.innerHTML=`<div class="card slide"><div class="ic">${x.ic}</div><h2>${pk(x.t)}</h2><p>${pk(x.b).replace(/\n/g,"<br>")}</p></div><div class="dots">${INTRO.map((_,i)=>`<i class="${i===intro?"on":""}"></i>`).join("")}</div><div class="navbtns">${intro>0?`<button class="btn alt" onclick="introBack()">${ARB()} ${L("السابق","Back")}</button>`:""}<button class="btn" onclick="introNext()">${intro===INTRO.length-1?L("هيا نبدأ","Let's start")+" ✓":L("التالي","Next")+" "+ARN()}</button></div><p style="text-align:center"><small><a href="#" style="color:var(--mu)" onclick="introSkip();return false">${L("تخطّي","Skip")}</a></small></p>`;return}
 nav.style.display=view==="ass"?"none":"flex";
 const tabs=[["home","🏠",L("الرئيسية","Home")],["res","📊",L("نتيجتي","Result")],["plan3","🗓️",L("خطتي","Plan")],["diary","📓",L("المفكرة","Diary")],["more","⋯",L("المزيد","More")]];
 nav.innerHTML=tabs.map(([k,i,l])=>`<button class="${(view===k||(k==="more"&&["foods","learn","recipes"].includes(view)))?"on":""}" onclick="go('${k}')"><span>${i}</span>${l}</button>`).join("");
 app.innerHTML=({home,ass,res,diary,foods,learn,plan3,recipes,more})[view]();
}
function introBack(){if(intro>0)intro--;render();scrollTo(0,0)}
function introSkip(){S.seen=true;save();render();scrollTo(0,0)}
function introNext(){if(intro<INTRO.length-1)intro++;else{S.seen=true;save()}render();scrollTo(0,0)}
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
